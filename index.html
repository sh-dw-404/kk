<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070916">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Our Little Universe</title>
<style>
:root{--bg:#050612;--glass:rgba(10,13,31,.72);--line:rgba(255,255,255,.14);--text:#f7f4ff;--muted:#b7b3c9;--accent:#ff8fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
button{font:inherit;color:inherit;border:0}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 30%,#171b48 0,#080a1b 42%,#03040b 100%)}
#space{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 45%,rgba(0,0,0,.48) 100%)}
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill,.panel{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 12px 35px rgba(0,0,0,.25)}
.pill{padding:9px 12px;border-radius:999px;font-size:12px;color:#ddd8ed}
#objective{position:absolute;left:14px;right:14px;bottom:max(96px,calc(84px + env(safe-area-inset-bottom)));padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.35}
#controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}
#joystick{width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);position:relative;pointer-events:auto}
#stick{position:absolute;width:48px;height:48px;border-radius:50%;left:34px;top:34px;background:rgba(255,143,184,.68);box-shadow:0 5px 25px rgba(255,80,140,.25)}
.actions{display:flex;gap:9px;pointer-events:auto}
.action{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);display:grid;place-items:center;font-size:12px}
#start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 42%,rgba(52,57,135,.42),rgba(3,4,11,.97) 70%);transition:opacity .55s ease,visibility .55s ease}
#start.hidden{opacity:0;visibility:hidden;pointer-events:none}
.card{width:min(430px,92vw);padding:28px 22px 22px;border-radius:28px;text-align:center;background:rgba(8,10,25,.78);border:1px solid rgba(255,255,255,.13);box-shadow:0 25px 80px rgba(0,0,0,.5);backdrop-filter:blur(16px)}
.orbit{width:130px;height:130px;margin:0 auto 18px;border-radius:50%;border:1px solid rgba(255,255,255,.2);position:relative;animation:spin 12s linear infinite}
.orbit:before{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5b0,#ff9f55 45%,#df416f);left:45px;top:45px;box-shadow:0 0 35px #ff769d}
.orbit:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:-5px;left:60px;box-shadow:0 0 12px #fff}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0 0 8px;font-size:clamp(28px,8vw,42px);letter-spacing:-1px} .sub{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.5}
#startBtn{width:100%;padding:15px 18px;border-radius:16px;background:linear-gradient(135deg,#ff9abd,#c875ff);color:#160a17;font-weight:800;box-shadow:0 10px 35px rgba(255,112,170,.25)}
#installBtn{display:none;margin-top:10px;width:100%;padding:13px;border-radius:15px;background:rgba(255,255,255,.09);border:1px solid var(--line)}
#message{position:absolute;inset:auto 14px 50%;transform:translateY(50%);display:none;text-align:center;font-size:15px;padding:16px 18px;border-radius:18px;background:rgba(5,6,18,.88);border:1px solid var(--line);box-shadow:0 15px 50px rgba(0,0,0,.45);pointer-events:none}
#message.show{display:block;animation:pop .45s ease}@keyframes pop{from{opacity:0;transform:translateY(50%) scale(.94)}to{opacity:1;transform:translateY(50%) scale(1)}}
#loading{position:absolute;inset:0;z-index:6;display:none;place-items:center;background:#050612;color:#ddd;text-align:center;padding:30px}
#loading.show{display:grid}.loader{width:38px;height:38px;border:3px solid rgba(255,255,255,.16);border-top-color:#ff91b8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@media (orientation:landscape) and (max-height:500px){#joystick{width:92px;height:92px}#stick{left:27px;top:27px}.action{width:48px;height:48px}#objective{bottom:72px;max-width:520px}}
</style>
</head>
<body>
<div id="app">
<canvas id="space"></canvas><div class="vignette"></div>
<div id="start"><div class="card"><div class="orbit"></div><h1>Our Little Universe</h1><p class="sub">A tiny universe made for two.<br>Find the glowing garden and bring the gift home.</p><button id="startBtn">Enter our universe</button><button id="installBtn">Install on this phone</button></div></div>
<div id="loading"><div><div class="loader"></div><div>Preparing your universe…</div></div></div>
<div id="hud"><div class="top"><div class="pill" id="location">STARFIELD</div><div class="pill" id="progress">0 / 3</div></div><div class="panel" id="objective">Move with the joystick. Explore until you find the glowing garden.</div><div id="message"></div><div id="controls"><div id="joystick"><div id="stick"></div></div><div class="actions"><button class="action" id="gift">GIFT</button><button class="action" id="interact">GO</button></div></div></div>
</div>
<script src="game.js"></script>
</body></html>
